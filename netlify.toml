# Netlify configuration for TAB Skills Tracker.
# The site itself is static (served from the repo root). Server-side pieces:
#   * ata-sheet          — legacy Google Sheet importer (CORS workaround)
#   * ata-teachable-sync — daily + on-demand pull of Teachable quiz results

[build]
  publish = "."
  # No build step for the static site; functions are bundled automatically.
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Every day at 12:00 UTC (7:00 AM US Eastern / 6:00 AM Central).
[functions."ata-teachable-sync"]
  schedule = "0 12 * * *"
