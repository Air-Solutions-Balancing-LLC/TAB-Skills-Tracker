# Netlify configuration for TAB Skills Tracker.
# The site itself is static (served from the repo root). Server-side pieces:
#   * ata-sheet                       — legacy Google Sheet importer (CORS workaround)
#   * ata-teachable-sync-background   — on-demand Teachable pull (15 min)
#   * ata-teachable-cron              — daily trigger that starts the background pull
# Scheduled functions cannot be called from the browser (HTTP 403) and are
# limited to 30s, so the long job must stay on the background function.

[build]
  publish = "."
  # No build step for the static site; functions are bundled automatically.
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."ata-teachable-sync-background"]
  background = true

[functions."ata-teachable-cron"]
  schedule = "0 12 * * *"
